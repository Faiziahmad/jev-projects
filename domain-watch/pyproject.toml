[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "domain-watch"
version = "0.1.0"
description = "Weekly plain-English domain health reports for small businesses, using public information only"
requires-python = ">=3.10"
dependencies = ["pyyaml"]

[project.scripts]
domain-watch = "domainwatch.cli:run"

[tool.setuptools.packages.find]
where = ["."]
include = ["domainwatch*"]
