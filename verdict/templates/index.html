<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VERDICT — AI Courtroom Judge</title>
<style>
  :root {
    --bg: #0c0c12;
    --panel: #13131f;
    --panel2: #1a1a2a;
    --border: #2a2a40;
    --gold: #c9a84c;
    --gold-dim: #8a6f32;
    --pros: #e05252;
    --pros-dim: #7a2222;
    --def: #5285e0;
    --def-dim: #22387a;
    --text: #e0e0f0;
    --muted: #6a6a8a;
    --green: #4caf82;
    --red: #e05252;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Georgia', serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ── header ── */
  header {
    background: var(--panel);
    border-bottom: 2px solid var(--gold);
    padding: 16px 32px;
    display: flex;
    align-items: center;
    gap: 20px;
  }
  header h1 { font-size: 1.8rem; color: var(--gold); letter-spacing: 4px; }
  header p  { color: var(--muted); font-size: 0.85rem; font-family: monospace; }

  /* ── layout ── */
  .game-layout {
    display: grid;
    grid-template-columns: 280px 1fr 300px;
    flex: 1;
    gap: 0;
    height: calc(100vh - 70px);
  }

  /* ── sidebar ── */
  .sidebar {
    background: var(--panel);
    border-right: 1px solid var(--border);
    padding: 20px 16px;
    overflow-y: auto;
  }
  .sidebar-right {
    border-right: none;
    border-left: 1px solid var(--border);
  }
  .sidebar h3 {
    font-size: 0.7rem;
    letter-spacing: 2px;
    color: var(--gold);
    text-transform: uppercase;
    margin-bottom: 12px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--border);
  }
  .fact-item {
    font-size: 0.8rem;
    color: var(--muted);
    margin-bottom: 8px;
    padding-left: 12px;
    border-left: 2px solid var(--border);
    line-height: 1.4;
  }
  .fact-item:hover { border-left-color: var(--gold); color: var(--text); }

  .evidence-tag {
    display: inline-block;
    background: var(--panel2);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 4px 8px;
    font-size: 0.75rem;
    color: var(--muted);
    margin: 3px 0;
    width: 100%;
  }

  /* ── main area ── */
  .main {
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── case banner ── */
  .case-banner {
    background: var(--panel2);
    border-bottom: 1px solid var(--border);
    padding: 16px 24px;
    text-align: center;
  }
  .case-banner .case-title { font-size: 1.1rem; color: var(--gold); }
  .case-banner .case-charge { font-size: 0.8rem; color: var(--muted); margin-top: 4px; }

  /* ── meter ── */
  .meter-section {
    padding: 20px 24px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
  }
  .meter-label {
    display: flex;
    justify-content: space-between;
    font-size: 0.7rem;
    color: var(--muted);
    letter-spacing: 1px;
    margin-bottom: 8px;
  }
  .meter-track {
    height: 24px;
    background: var(--panel2);
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid var(--border);
    position: relative;
  }
  .meter-fill-guilty {
    position: absolute;
    right: 0;
    top: 0;
    height: 100%;
    background: linear-gradient(90deg, #c94444, #e05252);
    transition: width 0.8s cubic-bezier(0.4,0,0.2,1);
    border-radius: 0 12px 12px 0;
  }
  .meter-fill-innocent {
    position: absolute;
    left: 0;
    top: 0;
    height: 100%;
    background: linear-gradient(90deg, #3d9e6b, #4caf82);
    transition: width 0.8s cubic-bezier(0.4,0,0.2,1);
    border-radius: 12px 0 0 12px;
  }
  .meter-center { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); width: 2px; height: 100%; background: var(--border); }
  .meter-prob {
    text-align: center;
    margin-top: 8px;
    font-size: 1.4rem;
    font-weight: bold;
    transition: color 0.5s;
  }
  .meter-status { text-align: center; font-size: 0.75rem; color: var(--muted); margin-top: 4px; }

  /* ── current turn ── */
  .turn-indicator {
    padding: 12px 24px;
    text-align: center;
    font-size: 0.85rem;
    letter-spacing: 1px;
    border-bottom: 1px solid var(--border);
  }
  .turn-pros { background: rgba(224,82,82,0.12); color: var(--pros); }
  .turn-def  { background: rgba(82,133,224,0.12); color: var(--def); }
  .turn-done { background: rgba(201,168,76,0.12); color: var(--gold); }

  /* ── argument area ── */
  .argument-area {
    flex: 1;
    padding: 20px 24px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    overflow-y: auto;
  }

  textarea {
    width: 100%;
    background: var(--panel2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: 'Georgia', serif;
    font-size: 0.95rem;
    padding: 14px;
    resize: vertical;
    min-height: 100px;
    outline: none;
    transition: border-color 0.2s;
  }
  textarea:focus { border-color: var(--gold); }
  textarea::placeholder { color: var(--muted); }

  .btn-row { display: flex; gap: 10px; align-items: center; }

  button {
    padding: 10px 24px;
    border-radius: 6px;
    border: none;
    cursor: pointer;
    font-family: 'Georgia', serif;
    font-size: 0.9rem;
    font-weight: bold;
    letter-spacing: 1px;
    transition: all 0.2s;
  }
  button:disabled { opacity: 0.4; cursor: not-allowed; }

  .btn-submit { background: var(--gold); color: #000; }
  .btn-submit:hover:not(:disabled) { background: #e0b95a; }

  .btn-ai { background: var(--panel2); color: var(--text); border: 1px solid var(--border); }
  .btn-ai:hover:not(:disabled) { border-color: var(--gold); color: var(--gold); }

  .btn-start { background: var(--gold); color: #000; font-size: 1rem; padding: 14px 36px; }
  .btn-start:hover { background: #e0b95a; }

  /* ── scores display ── */
  .score-card {
    background: var(--panel2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px;
  }
  .score-card.pros-card { border-left: 3px solid var(--pros); }
  .score-card.def-card  { border-left: 3px solid var(--def); }
  .score-row { display: flex; align-items: center; gap: 10px; margin: 6px 0; }
  .score-label { width: 90px; font-size: 0.75rem; color: var(--muted); }
  .score-bar-wrap { flex: 1; height: 8px; background: var(--panel); border-radius: 4px; overflow: hidden; }
  .score-bar-fill { height: 100%; border-radius: 4px; transition: width 0.6s; }
  .score-val { width: 36px; text-align: right; font-size: 0.75rem; color: var(--muted); }
  .score-arg { font-size: 0.85rem; color: var(--text); line-height: 1.5; margin-bottom: 10px; font-style: italic; }
  .delta-badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 0.75rem;
    font-weight: bold;
  }
  .delta-up   { background: rgba(224,82,82,0.2); color: var(--pros); }
  .delta-down { background: rgba(76,175,130,0.2); color: var(--green); }

  /* ── history (right sidebar) ── */
  .history-item {
    padding: 8px 10px;
    border-radius: 6px;
    margin-bottom: 8px;
    font-size: 0.78rem;
    border-left: 3px solid transparent;
  }
  .history-item.pros { border-left-color: var(--pros); background: rgba(224,82,82,0.07); }
  .history-item.def  { border-left-color: var(--def);  background: rgba(82,133,224,0.07); }
  .history-role  { font-size: 0.65rem; letter-spacing: 1px; margin-bottom: 4px; }
  .history-pros  { color: var(--pros); }
  .history-def   { color: var(--def); }
  .history-quote { color: var(--muted); line-height: 1.4; }
  .history-prob  { color: var(--gold); font-size: 0.7rem; margin-top: 4px; }

  /* ── verdict screen ── */
  .verdict-screen {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px;
    text-align: center;
  }
  .verdict-label {
    font-size: 4rem;
    font-weight: bold;
    letter-spacing: 8px;
    margin-bottom: 12px;
  }
  .verdict-sub { font-size: 1.1rem; color: var(--muted); margin-bottom: 32px; }
  .verdict-stats {
    background: var(--panel2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 24px 40px;
    margin-bottom: 24px;
    min-width: 400px;
  }
  .verdict-stats-row { display: flex; justify-content: space-between; margin: 8px 0; font-size: 0.9rem; }

  /* ── setup screen ── */
  #setup-screen {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    flex: 1;
    padding: 40px;
    gap: 24px;
  }
  .setup-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 32px;
    width: 500px;
    max-width: 100%;
  }
  .setup-card h2 { color: var(--gold); margin-bottom: 20px; font-size: 1rem; letter-spacing: 2px; }
  .form-row { margin-bottom: 16px; }
  label { display: block; font-size: 0.75rem; color: var(--muted); letter-spacing: 1px; margin-bottom: 6px; }
  select {
    width: 100%;
    background: var(--panel2);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-family: 'Georgia', serif;
    padding: 10px 12px;
    font-size: 0.9rem;
    outline: none;
    cursor: pointer;
  }
  select:focus { border-color: var(--gold); }

  .mode-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .mode-btn {
    background: var(--panel2);
    border: 2px solid var(--border);
    border-radius: 8px;
    padding: 12px 8px;
    cursor: pointer;
    text-align: center;
    transition: all 0.2s;
    color: var(--muted);
    font-size: 0.8rem;
  }
  .mode-btn:hover  { border-color: var(--gold-dim); color: var(--text); }
  .mode-btn.active { border-color: var(--gold); color: var(--gold); background: rgba(201,168,76,0.1); }
  .mode-icon { font-size: 1.4rem; margin-bottom: 4px; }

  /* ── thinking ── */
  .thinking {
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--muted);
    font-size: 0.85rem;
    padding: 10px 0;
  }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--gold); animation: pulse 1.2s infinite; }
  .dot:nth-child(2) { animation-delay: 0.2s; }
  .dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes pulse { 0%,100%{opacity:.3;transform:scale(1)} 50%{opacity:1;transform:scale(1.3)} }

  .hidden { display: none !important; }

  /* ── responsive ── */
  @media (max-width: 900px) {
    .game-layout { grid-template-columns: 1fr; }
    .sidebar { display: none; }
  }
</style>
</head>
<body>

<header>
  <div>
    <h1>VERDICT</h1>
    <p>AI Courtroom Judge — Powered by TypeSafe Jev</p>
  </div>
</header>

<!-- SETUP SCREEN -->
<div id="setup-screen">
  <div class="setup-card">
    <h2>SELECT CASE &amp; MODE</h2>

    <div class="form-row">
      <label>CASE</label>
      <select id="case-select">
        <option value="espionage">The Crown v. Marcus Webb — Corporate Espionage</option>
        <option value="breach">State v. Sarah Chen — Unauthorized Computer Access</option>
        <option value="fraud">People v. David Okafor — Wire Fraud</option>
      </select>
    </div>

    <div class="form-row">
      <label>GAME MODE</label>
      <div class="mode-grid">
        <div class="mode-btn active" data-mode="pvp">
          <div class="mode-icon">👥</div>
          <div>Player vs Player</div>
        </div>
        <div class="mode-btn" data-mode="pvai">
          <div class="mode-icon">🤖</div>
          <div>Player vs AI</div>
        </div>
        <div class="mode-btn" data-mode="aivai">
          <div class="mode-icon">⚔️</div>
          <div>AI vs AI</div>
        </div>
      </div>
    </div>

    <div class="form-row">
      <label>ROUNDS PER SIDE</label>
      <select id="rounds-select">
        <option value="4">4 rounds</option>
        <option value="6" selected>6 rounds</option>
        <option value="8">8 rounds</option>
      </select>
    </div>

    <button class="btn-start" onclick="startGame()">BEGIN TRIAL</button>
  </div>
</div>

<!-- GAME LAYOUT -->
<div class="game-layout hidden" id="game-layout">

  <!-- Left: Case facts -->
  <div class="sidebar" id="facts-panel">
    <h3>Case Facts</h3>
    <div id="facts-list"></div>
    <br>
    <h3>Evidence</h3>
    <div id="evidence-list"></div>
  </div>

  <!-- Center: Main game -->
  <div class="main">
    <div class="case-banner">
      <div class="case-title" id="case-title"></div>
      <div class="case-charge" id="case-charge"></div>
    </div>

    <div class="meter-section">
      <div class="meter-label">
        <span>NOT GUILTY</span>
        <span id="round-counter">Round 1</span>
        <span>GUILTY</span>
      </div>
      <div class="meter-track">
        <div class="meter-fill-innocent" id="meter-innocent" style="width:50%"></div>
        <div class="meter-fill-guilty"   id="meter-guilty"   style="width:50%"></div>
        <div class="meter-center"></div>
      </div>
      <div class="meter-prob" id="meter-prob">50%</div>
      <div class="meter-status" id="meter-status">Trial begins</div>
    </div>

    <div class="turn-indicator" id="turn-indicator">Loading...</div>

    <div class="argument-area" id="argument-area">
      <!-- dynamic content here -->
    </div>
  </div>

  <!-- Right: History -->
  <div class="sidebar sidebar-right">
    <h3>Argument History</h3>
    <div id="history-list"></div>
  </div>
</div>

<script>
let gameId = null;
let gameMode = 'pvp';
let gameData = null;
let isProcessing = false;

// ── mode selector ──────────────────────────────────────────
document.querySelectorAll('.mode-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    gameMode = btn.dataset.mode;
  });
});

// ── start game ─────────────────────────────────────────────
async function startGame() {
  const caseKey = document.getElementById('case-select').value;
  const rounds  = parseInt(document.getElementById('rounds-select').value);

  const resp = await fetch('/api/game/start', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ case: caseKey, mode: gameMode, max_rounds: rounds }),
  });
  gameData = await resp.json();
  gameId   = gameData.game_id;

  document.getElementById('setup-screen').classList.add('hidden');
  document.getElementById('game-layout').classList.remove('hidden');

  renderCase(gameData.case);
  updateMeter(0.50, 0, null);
  renderArgumentArea(gameData.current_role);

  if (gameMode === 'aivai') {
    setTimeout(triggerAI, 800);
  }
}

// ── render case info ───────────────────────────────────────
function renderCase(c) {
  document.getElementById('case-title').textContent  = c.title;
  document.getElementById('case-charge').textContent = c.charge;

  const fl = document.getElementById('facts-list');
  fl.innerHTML = c.facts.map(f => `<div class="fact-item">${f}</div>`).join('');

  const el = document.getElementById('evidence-list');
  el.innerHTML = c.evidence.map(e => `<div class="evidence-tag">• ${e}</div>`).join('');
}

// ── meter update ───────────────────────────────────────────
function updateMeter(prob, round, winner) {
  const guiltPct   = (prob * 100).toFixed(0);
  const innocentW  = ((1 - prob) * 100).toFixed(1);
  const guiltyW    = (prob * 100).toFixed(1);

  document.getElementById('meter-innocent').style.width = innocentW + '%';
  document.getElementById('meter-guilty').style.width   = guiltyW + '%';

  const probEl = document.getElementById('meter-prob');
  probEl.textContent = guiltPct + '% guilty';
  probEl.style.color = prob > 0.65 ? '#e05252' : prob < 0.35 ? '#4caf82' : '#e0e0f0';

  const totalRounds = gameData ? Math.floor(round / 2) : 0;
  const maxRounds   = gameData ? (gameData.max_rounds || 6) : 6;
  document.getElementById('round-counter').textContent = `Round ${totalRounds + 1} / ${maxRounds}`;

  const status = document.getElementById('meter-status');
  if (winner) {
    status.textContent = winner === 'prosecution' ? 'VERDICT: GUILTY' : 'VERDICT: NOT GUILTY';
  } else if (prob >= 0.75) {
    status.textContent = 'Prosecution leading';
  } else if (prob <= 0.25) {
    status.textContent = 'Defense leading';
  } else {
    status.textContent = 'Contested';
  }
}

// ── turn indicator ─────────────────────────────────────────
function updateTurnIndicator(role, finished, winner) {
  const el = document.getElementById('turn-indicator');
  if (finished) {
    el.className = 'turn-indicator turn-done';
    el.textContent = winner === 'prosecution' ? '⚖ GUILTY — Prosecution wins' : '⚖ NOT GUILTY — Defense wins';
  } else if (role === 'prosecution') {
    el.className = 'turn-indicator turn-pros';
    el.textContent = '⚔ PROSECUTION — Your turn to argue';
  } else {
    el.className = 'turn-indicator turn-def';
    el.textContent = '🛡 DEFENSE — Your turn to argue';
  }
}

// ── argument area ──────────────────────────────────────────
function renderArgumentArea(role) {
  const area = document.getElementById('argument-area');
  updateTurnIndicator(role, false, null);

  const isAI = (gameMode === 'aivai') ||
               (gameMode === 'pvai' && role === 'defense');

  if (isAI) {
    area.innerHTML = `
      <div class="thinking" id="thinking-indicator">
        <div class="dot"></div><div class="dot"></div><div class="dot"></div>
        <span>AI is deliberating...</span>
      </div>`;
  } else {
    const roleColor = role === 'prosecution' ? '#e05252' : '#5285e0';
    area.innerHTML = `
      <textarea id="arg-input"
        placeholder="Make your argument as ${role}. Reference the evidence. Be persuasive..."
        rows="5"></textarea>
      <div class="btn-row">
        <button class="btn-submit" onclick="submitArgument()">SUBMIT ARGUMENT</button>
        ${gameMode === 'pvp' ? '' : `<button class="btn-ai" onclick="triggerAI()">Let AI argue instead</button>`}
      </div>
      <div id="thinking-indicator" class="thinking hidden">
        <div class="dot"></div><div class="dot"></div><div class="dot"></div>
        <span>Jev is deliberating...</span>
      </div>`;
  }
}

// ── submit human argument ──────────────────────────────────
async function submitArgument() {
  const input = document.getElementById('arg-input');
  if (!input) return;
  const arg = input.value.trim();
  if (!arg || isProcessing) return;

  setProcessing(true);
  document.getElementById('thinking-indicator').classList.remove('hidden');

  const resp = await fetch(`/api/game/${gameId}/argue`, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ argument: arg }),
  });
  const data = await resp.json();
  handleResult(data);
}

// ── trigger AI argument ────────────────────────────────────
async function triggerAI() {
  if (isProcessing) return;
  setProcessing(true);

  const thinkingEl = document.getElementById('thinking-indicator');
  if (thinkingEl) thinkingEl.classList.remove('hidden');

  const resp = await fetch(`/api/game/${gameId}/ai-argue`, { method: 'POST' });
  const data = await resp.json();
  handleResult(data);

  // AI vs AI: chain next turn
  if (gameMode === 'aivai' && !data.finished) {
    setTimeout(triggerAI, 1200);
  }
}

// ── handle result ──────────────────────────────────────────
function handleResult(data) {
  setProcessing(false);

  updateMeter(data.guilty_prob, data.round_num, data.winner);
  addScoreCard(data);
  addHistory(data);

  if (data.finished) {
    updateTurnIndicator(null, true, data.winner);
    showVerdict(data);
  } else {
    updateTurnIndicator(data.current_role, false, null);

    const isNextAI = (gameMode === 'aivai') ||
                     (gameMode === 'pvai' && data.current_role === 'defense');
    renderArgumentArea(data.current_role);

    if (isNextAI && gameMode !== 'aivai') {
      setTimeout(triggerAI, 800);
    }
  }
}

// ── score card ─────────────────────────────────────────────
function addScoreCard(data) {
  const area  = document.getElementById('argument-area');
  const card  = document.createElement('div');
  const delta = data.guilty_delta;
  const deltaStr  = (delta >= 0 ? '+' : '') + (delta * 100).toFixed(1) + '%';
  const deltaClass = delta > 0 ? 'delta-up' : 'delta-down';
  const cardClass  = data.role === 'prosecution' ? 'pros-card' : 'def-card';
  const barColor   = data.role === 'prosecution' ? '#e05252' : '#5285e0';

  card.className = `score-card ${cardClass}`;
  card.innerHTML = `
    <div class="score-arg">"${data.argument}"</div>
    ${scoreRow('Logic',      data.logic,      barColor)}
    ${scoreRow('Evidence',   data.evidence,   barColor)}
    ${scoreRow('Persuasion', data.persuasion, barColor)}
    ${scoreRow('Relevant',   data.relevant,   barColor)}
    <div style="margin-top:10px;font-size:0.8rem;color:var(--muted)">
      Guilty probability: <strong style="color:var(--text)">${(data.guilty_prob*100).toFixed(1)}%</strong>
      &nbsp;<span class="delta-badge ${deltaClass}">${deltaStr}</span>
      ${data.ai_generated ? '<span style="color:var(--muted);font-size:0.7rem;margin-left:8px">🤖 AI</span>' : ''}
    </div>`;

  area.innerHTML = '';
  area.appendChild(card);
  area.scrollTop = area.scrollHeight;
}

function scoreRow(label, val, color) {
  const pct = (val * 100).toFixed(0);
  return `<div class="score-row">
    <span class="score-label">${label}</span>
    <div class="score-bar-wrap">
      <div class="score-bar-fill" style="width:${pct}%;background:${color}"></div>
    </div>
    <span class="score-val">${pct}%</span>
  </div>`;
}

// ── history ────────────────────────────────────────────────
function addHistory(data) {
  const list = document.getElementById('history-list');
  const item = document.createElement('div');
  const roleClass = data.role === 'prosecution' ? 'pros' : 'def';
  const roleLabel = data.role === 'prosecution' ? 'PROSECUTION' : 'DEFENSE';
  const labelClass = data.role === 'prosecution' ? 'history-pros' : 'history-def';
  const delta = (data.guilty_delta >= 0 ? '+' : '') + (data.guilty_delta * 100).toFixed(1) + '%';

  item.className = `history-item ${roleClass}`;
  item.innerHTML = `
    <div class="history-role ${labelClass}">${roleLabel}</div>
    <div class="history-quote">${data.argument.substring(0, 120)}${data.argument.length > 120 ? '…' : ''}</div>
    <div class="history-prob">Guilty: ${(data.guilty_prob*100).toFixed(0)}% (${delta})</div>`;

  list.prepend(item);
}

// ── verdict screen ─────────────────────────────────────────
function showVerdict(data) {
  setTimeout(() => {
    const area = document.getElementById('argument-area');
    const isGuilty = data.winner === 'prosecution';

    area.innerHTML = `
      <div class="verdict-screen">
        <div class="verdict-label" style="color:${isGuilty ? '#e05252' : '#4caf82'}">
          ${isGuilty ? 'GUILTY' : 'NOT GUILTY'}
        </div>
        <div class="verdict-sub">
          ${isGuilty ? 'Prosecution wins the trial' : 'Defense wins the trial'}
        </div>
        <div class="verdict-stats">
          <div class="verdict-stats-row">
            <span>Final guilty probability</span>
            <strong>${(data.guilty_prob*100).toFixed(1)}%</strong>
          </div>
          <div class="verdict-stats-row">
            <span>Arguments made</span>
            <strong>${data.round_num}</strong>
          </div>
          <div class="verdict-stats-row">
            <span>Judge</span>
            <strong>TypeSafe Jev</strong>
          </div>
        </div>
        <button class="btn-start" onclick="location.reload()">NEW TRIAL</button>
      </div>`;
  }, 400);
}

// ── utils ──────────────────────────────────────────────────
function setProcessing(val) {
  isProcessing = val;
  document.querySelectorAll('button').forEach(b => b.disabled = val);
}
</script>
</body>
</html>
