<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ApplyTrack</title>
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="../icons/icon32.png" alt="" width="20" height="20">
    <strong>ApplyTrack</strong>
    <span id="plan" class="pill"></span>
    <a id="open-board" class="btn small" href="board.html" target="_blank">Open board</a>
  </header>

  <main>
    <p id="notice" class="notice hidden"></p>

    <form id="form" class="hidden" autocomplete="off">
      <div><label for="title">Job title</label><input id="title" required></div>
      <div><label for="company">Company</label><input id="company"></div>
      <div class="row">
        <div><label for="location">Location</label><input id="location"></div>
        <div><label for="salary">Salary</label><input id="salary"></div>
      </div>
      <div><label for="status">Status</label><select id="status"></select></div>
      <div><label for="notes">Notes</label><textarea id="notes" rows="2" placeholder="Referral, recruiter name, next step…"></textarea></div>
      <p id="error" class="error hidden"></p>
      <button id="save" class="btn primary" type="submit">Save job</button>
    </form>

    <section id="saved" class="hidden done">
      <div class="check" aria-hidden="true">✓</div>
      <p id="saved-text"></p>
      <a class="btn" href="board.html" target="_blank">View on board</a>
    </section>

    <section id="limit" class="hidden upsell">
      <p><strong>You've reached the free limit.</strong></p>
      <p class="muted" id="limit-text"></p>
      <a class="btn primary" href="board.html#upgrade" target="_blank">Upgrade to Pro</a>
    </section>
  </main>

  <footer id="usage" class="muted"></footer>
  <script type="module" src="popup.js"></script>
</body>
</html>
