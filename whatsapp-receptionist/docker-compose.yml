# WhatsApp AI Receptionist: n8n + Postgres + Caddy (automatic HTTPS).
#
#   cp .env.example .env    # fill it in
#   docker compose up -d
#
# Twilio needs a public HTTPS URL, which Caddy provides. Point a DNS A record for
# N8N_DOMAIN at this server first, and open ports 80 and 443.
# The template was tested against n8n 2.40.7. Upgrade on purpose, not by accident.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: n8n
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n -d n8n"]
      interval: 10s
      timeout: 5s
      retries: 5

  n8n:
    image: docker.n8n.io/n8nio/n8n:${N8N_VERSION:-2.40.7}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # --- core -----------------------------------------------------------
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?set N8N_ENCRYPTION_KEY in .env}
      N8N_HOST: ${N8N_DOMAIN}
      N8N_PROTOCOL: https
      N8N_PROXY_HOPS: 1
      WEBHOOK_URL: https://${N8N_DOMAIN}/
      GENERIC_TIMEZONE: ${CLINIC_TIMEZONE:-America/New_York}
      TZ: ${CLINIC_TIMEZONE:-America/New_York}
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      # --- required by this workflow ----------------------------------------
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false" # workflow reads the settings below via $env
      NODE_FUNCTION_ALLOW_BUILTIN: crypto   # Twilio signature check in a Code node
      N8N_CONCURRENCY_PRODUCTION_LIMIT: 1   # process messages one at a time, in order
      # --- privacy: patient messages are stored in execution logs -------------
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: 336          # hours (14 days)
      # --- receptionist settings (see .env.example) ---------------------------
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
      TWILIO_WHATSAPP_NUMBER: ${TWILIO_WHATSAPP_NUMBER}
      TWILIO_WEBHOOK_URL: https://${N8N_DOMAIN}/webhook/whatsapp-inbound
      TWILIO_VALIDATE_SIGNATURE: ${TWILIO_VALIDATE_SIGNATURE:-true}
      TWILIO_REMINDER_CONTENT_SID: ${TWILIO_REMINDER_CONTENT_SID:-}
      STAFF_WHATSAPP_NUMBER: ${STAFF_WHATSAPP_NUMBER:-}
      GOOGLE_CALENDAR_ID: ${GOOGLE_CALENDAR_ID}
      GOOGLE_SHEET_ID: ${GOOGLE_SHEET_ID}
    volumes:
      - n8n_data:/home/node/.n8n
    # Only Caddy talks to n8n; nothing is published directly.
    expose:
      - "5678"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - n8n
    ports:
      - "80:80"
      - "443:443"
    environment:
      N8N_DOMAIN: ${N8N_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_data:
  n8n_data:
  caddy_data:
  caddy_config:
